[package]
name = "pnd_demo"
version = "0.1.0"
description = "pumpndump devnet v2 demo: vaults, test coins and encrypted balances run by a trusted executor. Not private from the executor."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pnd_demo"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
anchor-spl = { version = "1.0.2", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "associated_token"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
