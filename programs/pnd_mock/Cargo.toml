[package]
name = "pnd_mock"
version = "0.1.0"
description = "pumpndump devnet demo: Arcium replaced by a mock executor. Orders are not private."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pnd_mock"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
