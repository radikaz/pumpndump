[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.devnet]
pnd_spike = "8ZoAUA3iVcLxGHstnHz295DmfAtGE9PVZeHFueHP6NFR"
pnd_mock = "24GtYmstfSQN6xkpJREt3YQpQHeePr7xDRSMy2uo9mw8"
pnd_demo = "3qjjCvCh4txLgvuCsxKoHKvG9Lbv1Ax6CSvotX9ZYc1d"

[programs.localnet]
# Only the MXE program here: with a second program, `arcium test` does not set up pnd_spike's MXE.
# tests/pnd_mock.ts deploys pnd_mock itself.
pnd_spike = "8ZoAUA3iVcLxGHstnHz295DmfAtGE9PVZeHFueHP6NFR"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[hooks]

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "127.0.0.1"
ledger = ".anchor/test-ledger"
rpc_port = 8899
